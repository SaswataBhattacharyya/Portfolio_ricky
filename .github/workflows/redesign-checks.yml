name: Webberick redesign checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - name: Lint redesign files (legacy repository has unrelated lint failures)
        run: npx eslint src/pages/Index.tsx src/components/home/WebberickMascot.tsx src/lib/inquiry.ts src/test/inquiry.test.ts src/test/home-redesign.test.tsx

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python backend/manage.py check
